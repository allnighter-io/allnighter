name: AllnighterMac
options:
  bundleIdPrefix: com.allnighter
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  AllnighterCore:
    path: ../../Packages/AllnighterCore
  AllnighterMarkdown:
    path: ../../Packages/AllnighterMarkdown

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.1.3"
    CURRENT_PROJECT_VERSION: "1"

targets:
  AllnighterMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    dependencies:
      - package: AllnighterCore
        product: AllnighterCore
      - package: AllnighterCore
        product: AllnighterEngine
      - package: AllnighterMarkdown
        product: AllnighterMarkdown
    info:
      path: Sources/Info.plist
      properties:
        ALLNIGHTER_SUPABASE_URL: https://kfqwpozmntqpxiveafld.supabase.co
        ALLNIGHTER_SUPABASE_PUBLISHABLE_KEY: sb_publishable__rOinn0t1JKtj2-MI2-pew_ZhIUp9QV
        LSUIElement: true
        CFBundleDisplayName: Allnighter
        CFBundleName: Allnighter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.allnighter.mac
        PRODUCT_NAME: Allnighter
        # Keep the Swift module name = target name so `@testable import
        # AllnighterMac` resolves; PRODUCT_NAME (the .app/executable) stays
        # "Allnighter". Without this the module defaults to PRODUCT_NAME and the
        # test target can't import the host.
        PRODUCT_MODULE_NAME: AllnighterMac
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # Debug keeps Sign in with Apple (Apple Development profile). Release
        # must not: Apple rejects SIWA on Developer ID / Direct Distribution.
        CODE_SIGN_ENTITLEMENTS: Sources/AllnighterMac.entitlements
        # Apple Development signing — required so Screen Recording TCC survives
        # rebuilds (adhoc/CDHash grants do not stick). Team must match your cert.
        # Keychain: security find-identity -v -p codesigning
        DEVELOPMENT_TEAM: LP5YNK7A36
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_LDFLAGS: $(inherited) -framework ScreenCaptureKit
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: Sources/AllnighterMac.DeveloperID.entitlements

  AllnighterMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: AllnighterMac
      - package: AllnighterCore
        product: AllnighterCore
      - package: AllnighterCore
        product: AllnighterEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.allnighter.mac.tests
        DEVELOPMENT_TEAM: LP5YNK7A36
        GENERATE_INFOPLIST_FILE: YES
        # The host app's PRODUCT_NAME (Allnighter) differs from its target name
        # (AllnighterMac), so XcodeGen's auto-generated TEST_HOST points at a
        # non-existent AllnighterMac.app and `xcodebuild test` can't find the
        # host. Pin both to the real product so the green wall's Mac tests —
        # including the Launch Authority regression gates — actually run.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Allnighter.app/Contents/MacOS/Allnighter"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  AllnighterMac:
    build:
      targets:
        AllnighterMac: all
        AllnighterMacTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AllnighterMacTests
