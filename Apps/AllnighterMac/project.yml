name: AllnighterMac
options:
  bundleIdPrefix: com.allnighter
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  AllnighterCore:
    path: ../../Packages/AllnighterCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  AllnighterMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Drivers
        buildPhase: resources
      - path: Resources/Assets.xcassets
    dependencies:
      - package: AllnighterCore
        product: AllnighterCore
      - package: AllnighterCore
        product: AllnighterEngine
    info:
      path: Sources/Info.plist
      properties:
        # Standalone Dock app (Mac_Standalone slice 2). The bundle launches as an
        # accessory (LSUIElement) so the hosted unit-test runner can connect; for
        # real launches AppDelegate promotes to a regular Dock app
        # (setActivationPolicy(.regular)) with a visible icon + main window.
        LSUIElement: true
        CFBundleDisplayName: Allnighter
        CFBundleName: Allnighter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.allnighter.mac
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES

  AllnighterMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: AllnighterMac
      - package: AllnighterCore
        product: AllnighterCore
      - package: AllnighterCore
        product: AllnighterEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.allnighter.mac.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AllnighterMac:
    build:
      targets:
        AllnighterMac: all
        AllnighterMacTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AllnighterMacTests
