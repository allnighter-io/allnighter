name: AllnighterMac
options:
  bundleIdPrefix: com.allnighter
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  AllnighterCore:
    path: ../../Packages/AllnighterCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  AllnighterMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Drivers
        buildPhase: resources
      - path: Resources/Assets.xcassets
    dependencies:
      - package: AllnighterCore
        product: AllnighterCore
      - package: AllnighterCore
        product: AllnighterEngine
    info:
      path: Sources/Info.plist
      properties:
        # Standalone Dock app (Mac_Standalone slice 2). The bundle launches as an
        # accessory (LSUIElement) so the hosted unit-test runner can connect; for
        # real launches AppDelegate promotes to a regular Dock app
        # (setActivationPolicy(.regular)) with a visible icon + main window.
        LSUIElement: true
        CFBundleDisplayName: Allnighter
        CFBundleName: Allnighter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.allnighter.mac
        PRODUCT_NAME: Allnighter
        # Keep the Swift module name = target name so `@testable import
        # AllnighterMac` resolves; PRODUCT_NAME (the .app/executable) stays
        # "Allnighter". Without this the module defaults to PRODUCT_NAME and the
        # test target can't import the host.
        PRODUCT_MODULE_NAME: AllnighterMac
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # Apple Development signing — required so Screen Recording TCC survives
        # rebuilds (adhoc/CDHash grants do not stick). Team must match your cert.
        # Keychain: security find-identity -v -p codesigning
        DEVELOPMENT_TEAM: LP5YNK7A36
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_LDFLAGS: $(inherited) -framework ScreenCaptureKit

  AllnighterMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: AllnighterMac
      - package: AllnighterCore
        product: AllnighterCore
      - package: AllnighterCore
        product: AllnighterEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.allnighter.mac.tests
        DEVELOPMENT_TEAM: LP5YNK7A36
        GENERATE_INFOPLIST_FILE: YES
        # The host app's PRODUCT_NAME (Allnighter) differs from its target name
        # (AllnighterMac), so XcodeGen's auto-generated TEST_HOST points at a
        # non-existent AllnighterMac.app and `xcodebuild test` can't find the
        # host. Pin both to the real product so the green wall's Mac tests —
        # including the Launch Authority regression gates — actually run.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Allnighter.app/Contents/MacOS/Allnighter"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  AllnighterMac:
    build:
      targets:
        AllnighterMac: all
        AllnighterMacTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AllnighterMacTests
