<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{background:var(--bg-base);margin:0;padding:24px;font-family:var(--font-sans)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 24px;align-items:start}
</style></head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="../_preview.jsx"></script>
<script type="text/babel">
const { Input, Select, Textarea, Switch } = window;
ReactDOM.createRoot(document.getElementById('root')).render(
  <div className="grid">
    <Input label="Run name" placeholder="dashboard refresh" defaultValue="premium dashboard" />
    <Select label="PlanWriter" mono defaultValue="opus" options={[
      {value:'opus',label:'opus-4.8'},{value:'sonnet',label:'sonnet-4.6'},{value:'gpt',label:'gpt-5.5'}]} />
    <Input label="Timeout" suffix="sec" defaultValue="120" />
    <Input label="Slug" error="Already taken" defaultValue="mara" />
    <Textarea label="Prompt" rows={3} maxLength={280} showCount defaultValue="Give me three directions for making this dashboard feel premium." />
    <div style={{display:'flex',flexDirection:'column',gap:14,paddingTop:4}}>
      <Switch label="Opus 4.8" description="via Claude Code" defaultChecked />
      <Switch label="Gemini Flash" description="via gemini-cli" defaultChecked />
      <Switch label="Local only" />
    </div>
  </div>
);
</script>
</body></html>
