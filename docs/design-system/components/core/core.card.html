<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{background:var(--bg-base);margin:0;padding:24px;font-family:var(--font-sans)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  .lbl{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);width:100%;margin:0 0 -4px}
</style></head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="../_preview.jsx"></script>
<script type="text/babel">
const { Button, IconButton, Badge, Card, Icon } = window;
ReactDOM.createRoot(document.getElementById('root')).render(<>
  <div className="row">
    <Button variant="primary" iconLeft={<Icon name="play" size={15}/>}>Run council</Button>
    <Button variant="secondary">Add worker</Button>
    <Button variant="ghost">Cancel</Button>
    <Button variant="danger">Stop all</Button>
    <Button variant="primary" size="sm">sm</Button>
    <Button variant="secondary" disabled>Disabled</Button>
  </div>
  <div className="row">
    <IconButton variant="ghost" label="Copy"><Icon name="copy"/></IconButton>
    <IconButton variant="outline" label="Settings"><Icon name="settings-2"/></IconButton>
    <IconButton variant="solid" label="Rerun"><Icon name="rotate-cw"/></IconButton>
    <IconButton variant="accent" label="Synthesize"><Icon name="sparkles"/></IconButton>
    <span style={{width:16}}/>
    <Badge tone="accent">Pro</Badge>
    <Badge tone="positive" dot>Healthy</Badge>
    <Badge tone="info" dot>6 workers</Badge>
    <Badge tone="neutral" mono>1,284 tok</Badge>
  </div>
  <div className="row" style={{marginBottom:0}}>
    <Card style={{width:240}}>
      <div style={{fontWeight:600,marginBottom:4}}>Plan</div>
      <div style={{fontSize:12,color:'var(--text-muted)'}}>Consensus, conflicts, and a decisive plan.</div>
    </Card>
    <Card variant="accent" interactive style={{width:240}}>
      <div style={{fontWeight:600,color:'var(--accent-text)',marginBottom:4}}>Upgrade</div>
      <div style={{fontSize:12,color:'var(--text-muted)'}}>Custom domain &amp; deep analytics.</div>
    </Card>
  </div>
</>);
</script>
</body></html>
