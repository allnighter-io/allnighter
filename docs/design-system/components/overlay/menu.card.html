<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{background:var(--bg-base);margin:0;padding:24px;font-family:var(--font-sans)}</style></head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="../_preview.jsx"></script>
<script type="text/babel">
const { Menu, IconButton, Icon } = window;
ReactDOM.createRoot(document.getElementById('root')).render(
  <Menu align="start"
    trigger={<IconButton variant="outline" label="Run actions"><Icon name="settings-2"/></IconButton>}
    items={[
      { label: 'Rerun', icon: <Icon name="rotate-cw"/> },
      { label: 'Duplicate', icon: <Icon name="copy"/>, kbd: '⌘D' },
      { label: 'Pin worker', icon: <Icon name="zap"/> },
      { divider: true },
      { label: 'Delete run', icon: <Icon name="x"/>, danger: true },
    ]} />
);
setTimeout(() => document.querySelector('.al-menu__trigger')?.click(), 120);
</script>
</body></html>
