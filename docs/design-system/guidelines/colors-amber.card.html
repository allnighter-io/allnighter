<!-- @dsCard group="Colors" viewport="700x180" name="Amber — signature" subtitle="The one warm signal: primary actions, live state, the synthesizer" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-base);padding:22px;font-family:var(--font-sans)}
  .row{display:flex;gap:12px;align-items:flex-end}
  .sw{flex:1;display:flex;flex-direction:column;gap:8px}
  .box{height:72px;border-radius:var(--radius-md);border:1px solid var(--border-subtle)}
  .big{height:96px}
  .nm{font-size:11px;font-weight:600;color:var(--text-secondary)}
  .hx{font-family:var(--font-mono);font-size:11px;color:var(--text-faint)}
  .tag{font-size:10px;color:var(--accent-text);font-weight:600}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="box" style="background:var(--amber-300)"></div><div class="nm">amber-300</div><div class="hx">#FFD79E</div></div>
    <div class="sw"><div class="box" style="background:var(--amber-400)"></div><div class="nm">amber-400</div><div class="hx">#FFC169</div></div>
    <div class="sw"><div class="box big" style="background:var(--amber-500);box-shadow:var(--glow-amber)"></div><div class="nm">amber-500 <span class="tag">· primary</span></div><div class="hx">#FFA630</div></div>
    <div class="sw"><div class="box" style="background:var(--amber-600)"></div><div class="nm">amber-600</div><div class="hx">#F08D1C</div></div>
    <div class="sw"><div class="box" style="background:var(--amber-700)"></div><div class="nm">amber-700</div><div class="hx">#C26F12</div></div>
    <div class="sw"><div class="box" style="background:var(--amber-800)"></div><div class="nm">amber-800</div><div class="hx">#8A4E0A</div></div>
  </div>
</body></html>
