<!-- @dsCard group="Colors" viewport="700x180" name="Ink — text ramp" subtitle="Blue-tinted neutrals for type, from primary to faint" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-base);padding:22px;font-family:var(--font-sans)}
  .row{display:flex;gap:10px}
  .sw{flex:1;display:flex;flex-direction:column;gap:8px}
  .box{height:60px;border-radius:var(--radius-md);border:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:var(--bg-base)}
  .nm{font-size:10px;font-weight:600;color:var(--text-secondary)}
  .hx{font-family:var(--font-mono);font-size:10px;color:var(--text-faint)}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="box" style="background:var(--ink-50)">Aa</div><div class="nm">ink-50</div><div class="hx">#F2F4FA</div></div>
    <div class="sw"><div class="box" style="background:var(--ink-100)">Aa</div><div class="nm">100 · primary</div><div class="hx">#E1E5F0</div></div>
    <div class="sw"><div class="box" style="background:var(--ink-200)">Aa</div><div class="nm">200 · second</div><div class="hx">#AEB5C9</div></div>
    <div class="sw"><div class="box" style="background:var(--ink-300)">Aa</div><div class="nm">300 · muted</div><div class="hx">#7E869E</div></div>
    <div class="sw"><div class="box" style="background:var(--ink-400);color:var(--ink-50)">Aa</div><div class="nm">400 · faint</div><div class="hx">#555C74</div></div>
    <div class="sw"><div class="box" style="background:var(--ink-600);color:var(--ink-50)">Aa</div><div class="nm">600 · border</div><div class="hx">#252A39</div></div>
  </div>
</body></html>
