<!-- @dsCard group="Brand" viewport="700x240" name="Wordmark & lockup" subtitle="Mark + allnighter, set tight in SF Pro Display" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-base);font-family:var(--font-sans);padding:0}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
  .cell{padding:34px;display:flex;align-items:center;justify-content:center;min-height:170px;box-sizing:border-box}
  .cell+.cell{border-left:1px solid var(--border-subtle)}
  .b{border-top:1px solid var(--border-subtle)}
  .light{background:var(--bg-base)}
  .paper{background:var(--ink-50)}
  .lbl{position:absolute;font-family:var(--font-mono);font-size:10px;color:var(--text-faint);margin:0}
  .wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
  .cap{font-family:var(--font-mono);font-size:10px;color:var(--text-faint)}
</style></head>
<body>
  <div class="grid">
    <div class="cell light"><div class="wrap"><img src="../assets/allnighter-wordmark.svg" width="280"><span class="cap">primary · on midnight</span></div></div>
    <div class="cell light"><div class="wrap"><img src="../assets/allnighter-glyph.svg" width="68"><span class="cap">mark · standalone</span></div></div>
  </div>
</body></html>
