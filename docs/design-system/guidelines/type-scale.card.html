<!-- @dsCard group="Type" viewport="700x230" name="Type scale" subtitle="px · weight · line-height" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-base);padding:22px 26px;font-family:var(--font-sans)}
  table{width:100%;border-collapse:collapse}
  td{padding:7px 0;border-bottom:1px solid var(--border-subtle);vertical-align:baseline}
  .tok{font-family:var(--font-mono);font-size:11px;color:var(--accent-text);width:130px}
  .spec{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);text-align:right;white-space:nowrap}
  .ex{color:var(--text-primary)}
</style></head>
<body>
  <table>
    <tr><td class="tok">--text-display</td><td class="ex" style="font-size:24px;font-weight:800;letter-spacing:-.02em">Night shift</td><td class="spec">40 · 800 · 1.12</td></tr>
    <tr><td class="tok">--text-h1</td><td class="ex" style="font-size:20px;font-weight:700">Master plan</td><td class="spec">28 · 700 · 1.12</td></tr>
    <tr><td class="tok">--text-h2</td><td class="ex" style="font-size:17px;font-weight:700">Council run</td><td class="spec">22 · 700 · 1.3</td></tr>
    <tr><td class="tok">--text-title</td><td class="ex" style="font-size:15px;font-weight:600">Choose the panel</td><td class="spec">15 · 600 · 1.3</td></tr>
    <tr><td class="tok">--text-body</td><td class="ex" style="font-size:13px">The bench answers in parallel.</td><td class="spec">13 · 400 · 1.45</td></tr>
    <tr><td class="tok">--text-caption</td><td class="ex" style="font-size:11px;color:var(--text-muted)">local only · $0 marginal</td><td class="spec">11 · 400 · 1.3</td></tr>
  </table>
</body></html>
