<!-- @dsCard group="Colors" viewport="700x190" name="Surfaces" subtitle="Midnight elevation: void → base → surface → raised" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-base);padding:22px;font-family:var(--font-sans)}
  .row{display:flex;gap:12px}
  .sw{flex:1;display:flex;flex-direction:column;gap:8px}
  .box{height:74px;border-radius:var(--radius-md);border:1px solid var(--border-subtle)}
  .nm{font-size:11px;font-weight:600;color:var(--text-secondary)}
  .hx{font-family:var(--font-mono);font-size:11px;color:var(--text-faint)}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="box" style="background:var(--bg-void)"></div><div class="nm">void</div><div class="hx">#05060C</div></div>
    <div class="sw"><div class="box" style="background:var(--bg-base)"></div><div class="nm">base</div><div class="hx">#090B13</div></div>
    <div class="sw"><div class="box" style="background:var(--bg-subtle)"></div><div class="nm">subtle</div><div class="hx">#0D101A</div></div>
    <div class="sw"><div class="box" style="background:var(--bg-surface)"></div><div class="nm">surface</div><div class="hx">#111420</div></div>
    <div class="sw"><div class="box" style="background:var(--bg-raised)"></div><div class="nm">raised</div><div class="hx">#151822</div></div>
    <div class="sw"><div class="box" style="background:var(--bg-hover)"></div><div class="nm">hover</div><div class="hx">#1A1E2A</div></div>
    <div class="sw"><div class="box" style="background:var(--bg-active)"></div><div class="nm">active</div><div class="hx">#1F2331</div></div>
  </div>
</body></html>
