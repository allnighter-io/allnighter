<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allnighter — Logo exploration</title>
<link rel="stylesheet" href="styles.css">
<style>
  html,body{margin:0;height:100%}
  #root{height:100vh}
  .ab{width:100%;height:100%;background:#0B0E1A;border-radius:16px;display:flex;flex-direction:column;
      align-items:center;gap:18px;padding:30px 24px 26px;box-sizing:border-box;font-family:var(--font-sans)}
  .icon{width:184px;height:184px;filter:drop-shadow(0 18px 40px rgba(0,0,0,.6))}
  .lockup{display:flex;align-items:center;gap:11px;margin-top:auto}
  .lockup .g{width:30px;height:30px}
  .lockup .wm{font-family:var(--font-display);font-weight:800;font-size:25px;letter-spacing:-1.6px;color:#F2F4FA}
  .cap{font-family:var(--font-mono);font-size:11px;color:#7E869E;text-align:center;line-height:1.5;max-width:240px}
  .bare{width:54px;height:54px}
  .midrow{display:flex;align-items:center;gap:22px}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>

<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;

/* ---------- shared squircle wrapper ---------- */
function squircle(s, glyph, glow){
  glow = glow || {x:50,y:42,o:0.5};
  return `<svg viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="bg${s}" cx="50%" cy="30%" r="88%">
        <stop offset="0%" stop-color="#1B2138"/><stop offset="52%" stop-color="#0B0E1A"/><stop offset="100%" stop-color="#05060C"/>
      </radialGradient>
      <radialGradient id="gl${s}" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FFA630" stop-opacity="${glow.o}"/>
        <stop offset="46%" stop-color="#FFA630" stop-opacity="0.14"/>
        <stop offset="100%" stop-color="#FFA630" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="100" height="100" rx="23" fill="url(#bg${s})"/>
    <circle cx="${glow.x}" cy="${glow.y}" r="44" fill="url(#gl${s})"/>
    ${glyph}
    <rect x="0.5" y="0.5" width="99" height="99" rx="22.5" fill="none" stroke="#fff" stroke-opacity="0.07"/>
  </svg>`;
}
function bareSvg(glyph){
  return `<svg viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">${glyph}</svg>`;
}

/* ---------- glyph concepts (100x100 space) ---------- */
const G = {
  // 1 — Beam A: an A drawn in light, standing in a shaft of amber
  beamA: (s)=>`
    <defs>
      <linearGradient id="ag${s}" x1="50" y1="22" x2="50" y2="82" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#FFE3B4"/><stop offset=".5" stop-color="#FFA630"/><stop offset="1" stop-color="#EF8C1A"/></linearGradient>
      <linearGradient id="cone${s}" x1="50" y1="14" x2="50" y2="90" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#FFA630" stop-opacity=".40"/><stop offset="1" stop-color="#FFA630" stop-opacity="0"/></linearGradient>
    </defs>
    <polygon points="50,15 86,90 14,90" fill="url(#cone${s})"/>
    <g stroke="url(#ag${s})" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M50 24 L31 79"/><path d="M50 24 L69 79"/><path d="M39 61 L61 61"/>
    </g>
    <circle cx="50" cy="22" r="3.4" fill="#FFF1D6"/>`,

  // 2 — Monolith A: bold A raked by a side light (lit left, shadowed right)
  solidA: (s)=>`
    <defs>
      <linearGradient id="ra${s}" x1="26" y1="40" x2="78" y2="60" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#FFE0AE"/><stop offset=".48" stop-color="#FFA630"/><stop offset="1" stop-color="#B5660D"/></linearGradient>
    </defs>
    <g stroke="url(#ra${s})" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M50 22 L28 80"/><path d="M50 22 L72 80"/><path d="M37.5 60 L62.5 60"/>
    </g>
    <path d="M50 22 L28 80" stroke="#FFF0D2" stroke-opacity=".55" stroke-width="2.4" stroke-linecap="round" fill="none"/>`,

  // 3 — Desk lamp: an anglepoise on the night shift, pooling amber light
  lamp: (s)=>`
    <defs>
      <linearGradient id="lc${s}" x1="62" y1="44" x2="80" y2="88" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#FFC169" stop-opacity=".7"/><stop offset="1" stop-color="#FFA630" stop-opacity="0"/></linearGradient>
    </defs>
    <!-- light cone + pool -->
    <polygon points="61,47 75,47 88,86 56,86" fill="url(#lc${s})"/>
    <ellipse cx="72" cy="86" rx="17" ry="3.4" fill="#FFA630" fill-opacity=".30"/>
    <!-- arm -->
    <g stroke="#FFC169" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M27 84 L37 53"/><path d="M37 53 L58 43"/>
    </g>
    <!-- base -->
    <rect x="18" y="83.5" width="22" height="4.6" rx="2.3" fill="#FFC169"/>
    <!-- joints -->
    <circle cx="37" cy="53" r="3.1" fill="#FFD79E"/>
    <circle cx="27" cy="84" r="2.4" fill="#FFD79E"/>
    <!-- shade -->
    <path d="M55 39 L70 45 L67 52 L60 49 Z" fill="#FFB44D"/>
    <path d="M55 39 L70 45" stroke="#FFE8C4" stroke-width="2" stroke-linecap="round"/>`,

  // 4 — Night bulb: the one light still on
  bulb: (s)=>`
    <defs>
      <radialGradient id="bb${s}" cx="50%" cy="46%" r="55%">
        <stop offset="0" stop-color="#FFE3B4"/><stop offset=".55" stop-color="#FFA630"/><stop offset="1" stop-color="#EF8C1A"/></radialGradient>
    </defs>
    <line x1="50" y1="9" x2="50" y2="30" stroke="#6B7286" stroke-width="2" stroke-linecap="round"/>
    <rect x="44.5" y="29" width="11" height="7" rx="2" fill="#C26F12"/>
    <rect x="46.5" y="35" width="7" height="3" rx="1.5" fill="#8A4E0A"/>
    <circle cx="50" cy="56" r="18" fill="url(#bb${s})"/>
    <path d="M44 54 L48 50 L50 58 L52 50 L56 54" stroke="#FFF4DE" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>`,

  // 5 — Crescent (current mark) for comparison
  crescent: (s)=>`
    <defs>
      <linearGradient id="cg${s}" x1="26" y1="22" x2="70" y2="80" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#FFD79E"/><stop offset=".5" stop-color="#FFA630"/><stop offset="1" stop-color="#F0901C"/></linearGradient>
      <mask id="cm${s}"><rect width="100" height="100" fill="black"/><circle cx="49" cy="52" r="30" fill="white"/><circle cx="63" cy="42" r="27" fill="black"/></mask>
    </defs>
    <rect width="100" height="100" fill="url(#cg${s})" mask="url(#cm${s})"/>
    <path d="M70 28 C70 33 71.4 34.4 76.5 34.4 C71.4 34.4 70 35.8 70 40.8 C70 35.8 68.6 34.4 63.5 34.4 C68.6 34.4 70 33 70 28 Z" fill="#FFD79E"/>`,
};

const CONCEPTS = [
  { id:'beamA',  name:'A · Beam',     glyph:'beamA',  glow:{x:50,y:40,o:.5},  cap:'the “A” drawn in light —\na shaft falling through the dark' },
  { id:'solidA', name:'B · Monolith', glyph:'solidA', glow:{x:34,y:30,o:.46}, cap:'a bold A raked by a side\nlamp — lit left, shadow right' },
  { id:'lamp',   name:'C · Desk lamp', glyph:'lamp',  glow:{x:72,y:70,o:.5},  cap:'anglepoise on the night\nshift, pooling amber light' },
  { id:'bulb',   name:'D · Night bulb', glyph:'bulb', glow:{x:50,y:54,o:.55}, cap:'the one light still on —\nminimal, poetic, ownable' },
  { id:'crescent', name:'E · Crescent (current)', glyph:'crescent', glow:{x:46,y:50,o:.5}, cap:'where we started —\nnight, but reads astrology' },
];

function Raw({html, cls}){ return <div className={cls} dangerouslySetInnerHTML={{__html:html}}/>; }

function Board({c}){
  const inner = G[c.glyph](c.id);
  return (
    <div className="ab">
      <Raw cls="icon" html={squircle(c.id, inner, c.glow)} />
      <div className="midrow">
        <Raw cls="bare" html={bareSvg(G[c.glyph](c.id+'b'))} />
        <div className="cap">{c.cap}</div>
      </div>
      <div className="lockup">
        <Raw cls="g" html={bareSvg(G[c.glyph](c.id+'w'))} />
        <span className="wm">allnighter</span>
      </div>
    </div>
  );
}

function App(){
  return (
    <DesignCanvas>
      <DCSection id="logo" title="Allnighter — logo directions" subtitle="Lamp & lit-A explorations vs. the crescent. Open any in focus mode (↵).">
        {CONCEPTS.map(c=>(
          <DCArtboard key={c.id} id={c.id} label={c.name} width={300} height={372}>
            <Board c={c}/>
          </DCArtboard>
        ))}
      </DCSection>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
