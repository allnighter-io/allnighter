<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allnighter — Moon refinement</title>
<link rel="stylesheet" href="styles.css">
<style>
  html,body{margin:0;height:100%}
  #root{height:100vh}
  .ab{width:100%;height:100%;background:#0B0E1A;border-radius:16px;display:flex;flex-direction:column;
      align-items:center;gap:18px;padding:30px 24px 26px;box-sizing:border-box;font-family:var(--font-sans)}
  .icon{width:184px;height:184px;filter:drop-shadow(0 18px 40px rgba(0,0,0,.6))}
  .lockup{display:flex;align-items:center;gap:11px;margin-top:auto}
  .lockup .g{width:30px;height:30px}
  .lockup .wm{font-family:var(--font-display);font-weight:800;font-size:25px;letter-spacing:-1.6px;color:#F2F4FA}
  .cap{font-family:var(--font-mono);font-size:11px;color:#7E869E;text-align:center;line-height:1.5;max-width:244px}
  .bare{width:54px;height:54px}
  .midrow{display:flex;align-items:center;gap:22px}
  .blink{animation:bl 1.1s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>

<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;

function squircle(s, glyph, glow){
  glow = glow || {x:46,y:48,o:0.5};
  return `<svg viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="bg${s}" cx="50%" cy="30%" r="88%">
        <stop offset="0%" stop-color="#1B2138"/><stop offset="52%" stop-color="#0B0E1A"/><stop offset="100%" stop-color="#05060C"/>
      </radialGradient>
      <radialGradient id="gl${s}" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FFA630" stop-opacity="${glow.o}"/>
        <stop offset="46%" stop-color="#FFA630" stop-opacity="0.14"/>
        <stop offset="100%" stop-color="#FFA630" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="100" height="100" rx="23" fill="url(#bg${s})"/>
    <circle cx="${glow.x}" cy="${glow.y}" r="44" fill="url(#gl${s})"/>
    ${glyph}
    <rect x="0.5" y="0.5" width="99" height="99" rx="22.5" fill="none" stroke="#fff" stroke-opacity="0.07"/>
  </svg>`;
}
function bareSvg(glyph){ return `<svg viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">${glyph}</svg>`; }

// crescent body (no star). cy lets us lift it for the light-pool version.
function moon(s, cy){
  cy = cy || 50;
  return `<defs>
    <linearGradient id="cg${s}" x1="20" y1="${cy-26}" x2="66" y2="${cy+30}" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD79E"/><stop offset=".5" stop-color="#FFA630"/><stop offset="1" stop-color="#F0901C"/></linearGradient>
    <mask id="cm${s}"><rect width="100" height="100" fill="black"/>
      <circle cx="47" cy="${cy}" r="32" fill="white"/><circle cx="62" cy="${cy-9}" r="28" fill="black"/></mask>
  </defs>
  <rect width="100" height="100" fill="url(#cg${s})" mask="url(#cm${s})"/>`;
}

const G = {
  plain:  (s)=> moon(s),
  cursor: (s)=> moon(s) + `<rect x="60" y="43" width="10.5" height="17" rx="2.6" fill="#FFE9C6"/>`,
  under:  (s)=> moon(s) + `<rect x="56" y="58" width="16" height="4" rx="2" fill="#FFE9C6"/>`,
  ring:   (s)=> `<circle cx="46" cy="52" r="39" fill="none" stroke="#FFB44D" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="150 95" transform="rotate(135 46 52)"/>` + moon(s),
  pool:   (s)=> `<defs><radialGradient id="pl${s}" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFA630" stop-opacity=".55"/><stop offset="100%" stop-color="#FFA630" stop-opacity="0"/></radialGradient></defs>`
                + `<ellipse cx="50" cy="83" rx="30" ry="7" fill="url(#pl${s})"/>`
                + `<rect x="22" y="82.4" width="56" height="2" rx="1" fill="#FFA630" fill-opacity=".28"/>`
                + moon(s, 42),
};

const CONCEPTS = [
  { id:'plain',  name:'A · Crescent (no star)', glyph:'plain',  glow:{x:46,y:48,o:.5},
    cap:'just the moon, star removed —\nkills the astrology tell' },
  { id:'cursor', name:'B · Cursor block', glyph:'cursor', glow:{x:50,y:48,o:.52},
    cap:'a terminal cursor still blinking\nin the dark — “working at night”' },
  { id:'under',  name:'C · Prompt underscore', glyph:'under', glow:{x:48,y:50,o:.5},
    cap:'the underscore of a shell prompt\n— minimal, quiet dev cue' },
  { id:'ring',   name:'D · Progress ring', glyph:'ring',  glow:{x:46,y:50,o:.5},
    cap:'a loading arc around the moon —\nwork running through the night' },
  { id:'pool',   name:'E · Light pool', glyph:'pool',  glow:{x:50,y:60,o:.5},
    cap:'the moon casting an amber pool\non the desk — a lit workspace' },
];

function Raw({html, cls}){ return <div className={cls} dangerouslySetInnerHTML={{__html:html}}/>; }

function Board({c}){
  const blink = c.id==='cursor' || c.id==='under';
  return (
    <div className="ab">
      <Raw cls="icon" html={squircle(c.id, G[c.glyph](c.id), c.glow)} />
      <div className="midrow">
        <Raw cls={"bare"+(blink?' blink':'')} html={bareSvg(G[c.glyph](c.id+'b'))} />
        <div className="cap">{c.cap}</div>
      </div>
      <div className="lockup">
        <Raw cls="g" html={bareSvg(G[c.glyph](c.id+'w'))} />
        <span className="wm">allnighter</span>
      </div>
    </div>
  );
}

function App(){
  return (
    <DesignCanvas>
      <DCSection id="moon" title="Allnighter — moon, de-astrology'd" subtitle="No star, amber, + a 'still-working' cue. Open any in focus mode (↵).">
        {CONCEPTS.map(c=>(
          <DCArtboard key={c.id} id={c.id} label={c.name} width={300} height={372}>
            <Board c={c}/>
          </DCArtboard>
        ))}
      </DCSection>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
