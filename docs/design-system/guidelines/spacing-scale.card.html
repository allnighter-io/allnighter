<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing scale" subtitle="4px base grid" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-base);padding:24px;font-family:var(--font-sans)}
  .row{display:flex;align-items:flex-end;gap:14px}
  .u{display:flex;flex-direction:column;gap:8px;align-items:center}
  .bar{width:30px;background:var(--accent);border-radius:3px}
  .n{font-family:var(--font-mono);font-size:10px;color:var(--text-faint)}
  .nm{font-size:10px;color:var(--text-muted);font-weight:600}
</style></head>
<body>
  <div class="row">
    <div class="u"><div class="bar" style="height:4px"></div><div class="nm">1</div><div class="n">4</div></div>
    <div class="u"><div class="bar" style="height:8px"></div><div class="nm">2</div><div class="n">8</div></div>
    <div class="u"><div class="bar" style="height:12px"></div><div class="nm">3</div><div class="n">12</div></div>
    <div class="u"><div class="bar" style="height:16px"></div><div class="nm">4</div><div class="n">16</div></div>
    <div class="u"><div class="bar" style="height:24px"></div><div class="nm">6</div><div class="n">24</div></div>
    <div class="u"><div class="bar" style="height:32px"></div><div class="nm">8</div><div class="n">32</div></div>
    <div class="u"><div class="bar" style="height:48px"></div><div class="nm">12</div><div class="n">48</div></div>
    <div class="u"><div class="bar" style="height:64px"></div><div class="nm">16</div><div class="n">64</div></div>
    <div class="u"><div class="bar" style="height:80px"></div><div class="nm">20</div><div class="n">80</div></div>
  </div>
</body></html>
