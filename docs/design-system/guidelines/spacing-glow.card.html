<!-- @dsCard group="Spacing" viewport="700x190" name="Amber glow — alive" subtitle="Primary hover, the plan writer, live workers" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-base);padding:28px 24px;font-family:var(--font-sans);display:flex;gap:30px;align-items:center;justify-content:center}
  .u{display:flex;flex-direction:column;gap:14px;align-items:center}
  .nm{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
  .btn{height:34px;padding:0 18px;border-radius:var(--radius-sm);background:var(--accent);color:var(--text-on-amber);font-weight:600;font-size:13px;display:flex;align-items:center;border:none}
  .dot{width:18px;height:18px;border-radius:50%;background:var(--accent)}
  .ring{width:64px;height:64px;border-radius:50%;border:2px solid var(--accent-border);display:flex;align-items:center;justify-content:center}
</style></head>
<body>
  <div class="u"><div class="btn" style="box-shadow:var(--glow-amber-sm)">Run team</div><div class="nm">glow-amber-sm</div></div>
  <div class="u"><div class="dot" style="box-shadow:var(--glow-amber)"></div><div class="nm">glow-amber</div></div>
  <div class="u"><div class="ring" style="box-shadow:var(--glow-amber-lg)"><div class="dot"></div></div><div class="nm">glow-amber-lg</div></div>
</body></html>
