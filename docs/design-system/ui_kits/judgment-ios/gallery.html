<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allnighter — Judgment iOS · all screens</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0;background:var(--bg-void);min-height:100%}
  .wrap{padding:32px;font-family:var(--font-sans)}
  h1{font-family:var(--font-display);font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--ink-50);margin:0 0 4px}
  .sub{color:var(--text-muted);font-size:13px;margin-bottom:26px}
  .grid{display:flex;flex-wrap:wrap;gap:30px 26px}
  .cell{display:flex;flex-direction:column;gap:10px;align-items:center}
  .frame{width:209px;height:455px;overflow:hidden;border-radius:25px}
  .scaler{transform:scale(0.52);transform-origin:top left}
  .lbl{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);font-weight:600}
  .lbl span{color:var(--text-faint);font-weight:400}
</style>
</head>
<body>
<div class="wrap">
  <h1>Judgment workflow · iOS — all screens</h1>
  <div class="sub">Every mockup at a glance, no tapping. The live prototype is <code>index.html</code>.</div>
  <div id="root"></div>
</div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="../../components/_preview.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="screens2.jsx"></script>
<script type="text/babel" src="screens3.jsx"></script>
<script type="text/babel">
const { IOSDevice, JIOS_Inbox, JIOS_Compose, JIOS_Review, JIOS_Final, JIOS_Dispatch, JIOS_Return, JIOS_Routing, JIOS_LiveRun, JIOS_Analysis, JIOS_Scorecards } = window;
const noop = () => {};
function Cell({ label, sub, children }) {
  return (
    <div className="cell">
      <div className="frame"><div className="scaler">
        <IOSDevice dark><div className="jio-app"><div className="jio-scroll">{children}</div></div></IOSDevice>
      </div></div>
      <div className="lbl">{label} <span>· {sub}</span></div>
    </div>
  );
}
const SCREENS = [
  ['Inbox', 'needs you', <JIOS_Inbox open={noop} />],
  ['Compose', 'prompt + call plan', <JIOS_Compose />],
  ['Live run', 'progress', <JIOS_LiveRun back={noop} />],
  ['Judge analysis', 'structured', <JIOS_Analysis back={noop} />],
  ['Review board', 'verdicts', <JIOS_Review back={noop} />],
  ['Final spec', 'implement', <JIOS_Final back={noop} />],
  ['Dispatch', 'boundary + run', <JIOS_Dispatch back={noop} onReturn={noop} />],
  ['Return review', 'outcome 0.86', <JIOS_Return back={noop} />],
  ['Routing', 'rerun / remix / pick', <JIOS_Routing back={noop} onScores={noop} />],
  ['Scorecards', 'per-worker', <JIOS_Scorecards back={noop} />],
];
ReactDOM.createRoot(document.getElementById('root')).render(
  <div className="grid">{SCREENS.map((s, i) => <Cell key={i} label={s[0]} sub={s[1]}>{s[2]}</Cell>)}</div>
);
</script>
</body>
</html>
