<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allnighter — Review workflow</title>
<link rel="icon" href="../../assets/allnighter-icon.svg">
<link rel="stylesheet" href="../../styles.css">
<style>
  html,body{height:100%;margin:0}
  body{background:var(--bg-void);display:flex;align-items:center;justify-content:center}
  #root{width:100%;height:100%}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="../../components/_preview.jsx"></script>
<script type="text/babel" src="shell.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="screens2.jsx"></script>
<script type="text/babel" src="screens3.jsx"></script>
<script type="text/babel" src="screens4.jsx"></script>
<script type="text/babel">
const { JShell, JConfigShell, ComposerView, ReviewBoardView, FinalSpecView, RunPipelineView, PlanAnalysisView, DispatchView, ReturnReviewView, RoutingView, CompareView, ScorecardsView, PresetEditorView, LensLibraryView, WorkersView, StubView } = window;
const LABELS = { team: 'Team answers', plan: 'Draft plan' };

function ReviewApp() {
  const [active, setActive] = React.useState('prompt');
  if (active.indexOf('cfg_') === 0) {
    let cv;
    if (active === 'cfg_scorecards') cv = <ScorecardsView />;
    else if (active === 'cfg_presets') cv = <PresetEditorView />;
    else if (active === 'cfg_lenses') cv = <LensLibraryView />;
    else cv = <WorkersView />;
    return <JConfigShell active={active} onNav={setActive}>{cv}</JConfigShell>;
  }
  let view;
  if (active === 'prompt') view = <ComposerView onRun={() => setActive('overview')} />;
  else if (active === 'overview') view = <RunPipelineView onNav={setActive} />;
  else if (active === 'analysis') view = <PlanAnalysisView />;
  else if (active === 'review') view = <ReviewBoardView />;
  else if (active === 'final') view = <FinalSpecView onImplement={() => setActive('dispatch')} />;
  else if (active === 'dispatch') view = <DispatchView />;
  else if (active === 'return') view = <ReturnReviewView onNav={setActive} />;
  else if (active === 'routing') view = <RoutingView onNav={setActive} />;
  else if (active === 'compare') view = <CompareView />;
  else view = <StubView stage={LABELS[active] || active} />;
  return <JShell active={active} onNav={setActive}>{view}</JShell>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<ReviewApp />);
</script>
</body>
</html>
