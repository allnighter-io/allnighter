# Extends built-in :workspace; only overrides .git for commit handoff.
# Do NOT add sandbox_mode, [sandbox_workspace_write], or [permissions.*.workspace_roots].
default_permissions = "workspace-git"

[permissions.workspace-git]
description = "Workspace write access plus git metadata writes; hooks stay denied."
extends = ":workspace"

[permissions.workspace-git.filesystem.":workspace_roots"]
".git" = "write"
".git/hooks" = "deny"

[permissions.workspace-git.network]
enabled = true

[permissions.workspace-git.network.domains]
"*" = "allow"
